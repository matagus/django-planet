name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
        os: [ubuntu-latest]
        exclude:
          # Django 4.2: only 3.11, 3.12
          - django-version: "4.2"
            python-version: "3.13"
          - django-version: "4.2"
            python-version: "3.14"
          - django-version: "4.2"
            python-version: "3.15"
          # Django 5.0: only 3.11, 3.12
          - django-version: "5.0"
            python-version: "3.13"
          - django-version: "5.0"
            python-version: "3.14"
          - django-version: "5.0"
            python-version: "3.15"
          # Django 5.1: only 3.11, 3.12
          - django-version: "5.1"
            python-version: "3.13"
          - django-version: "5.1"
            python-version: "3.14"
          - django-version: "5.1"
            python-version: "3.15"
          # Django 5.2: only 3.11, 3.12
          - django-version: "5.2"
            python-version: "3.13"
          - django-version: "5.2"
            python-version: "3.14"
          - django-version: "5.2"
            python-version: "3.15"
          # Django 6.0: only 3.12, 3.13, 3.14
          - django-version: "6.0"
            python-version: "3.11"
          - django-version: "6.0"
            python-version: "3.15"
          # Django 6.1: only 3.12, 3.13, 3.14, 3.15
          - django-version: "6.1"
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade hatch "virtualenv<20.25"
      - name: Run tests for Python ${{ matrix.python-version }} and Django ${{ matrix.django-version }} on ${{ matrix.os }} with coverage report
        run: |
          hatch run test.py${{ matrix.python-version }}-${{ matrix.django-version }}:cov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
